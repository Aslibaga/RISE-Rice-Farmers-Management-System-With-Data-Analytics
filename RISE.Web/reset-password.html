<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RISE – Rice Farmer Management System – Reset Password">
    <title>RISE | Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Manrope:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="pages/css/style.css">
    <style>
        .auth-background {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(rgba(10, 35, 22, 0.72), rgba(10, 35, 22, 0.80)),
                url("pictures/backimg.jpg") center / cover fixed no-repeat,
                var(--deep-forest);
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 40px 24px;
        }
        .auth-panel {
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            color: var(--white);
            background: rgba(12, 42, 27, 0.82);
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow: hidden;
        }
        .auth-header {
            padding: 32px 32px 24px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
        }
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .auth-brand-mark {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 14px;
            color: var(--rice-gold);
            background: rgba(255, 255, 255, 0.08);
            font-size: 24px;
        }
        .auth-brand-text strong {
            display: block;
            font-family: Manrope, sans-serif;
            font-size: 24px;
            letter-spacing: 0.08em;
        }
        .auth-brand-text span {
            display: block;
            color: var(--muted-white);
            font-size: 11px;
            margin-top: 2px;
        }
        .auth-welcome {
            font-size: 24px;
            font-weight: 800;
            font-family: Manrope, sans-serif;
            margin: 0 0 8px;
            color: var(--white);
        }
        .auth-subtitle {
            color: var(--muted-white);
            font-size: 13px;
            margin: 0;
            line-height: 1.5;
        }
        .auth-body {
            padding: 28px 32px 32px;
        }
        .auth-field {
            margin-bottom: 16px;
        }
        .auth-field label {
            display: block;
            color: var(--muted-white);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.04em;
        }
        .auth-field input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.17);
            border-radius: 9px;
            color: var(--white);
            background-color: rgba(8, 33, 21, 0.58);
            font-size: 13px;
            font-family: inherit;
        }
        .auth-field input::placeholder {
            color: rgba(208, 221, 211, 0.62);
        }
        .auth-field input:focus {
            outline: none;
            border-color: rgba(214, 168, 62, 0.75);
            box-shadow: 0 0 0 0.2rem rgba(214, 168, 62, 0.14);
            color: var(--white);
            background-color: rgba(8, 33, 21, 0.74);
        }
        .password-input {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--muted-white);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toggle-password:hover {
            color: var(--white);
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            background: var(--rice-gold);
            color: var(--deep-forest);
            cursor: pointer;
            transition: background 0.18s ease, transform 0.18s ease;
            font-family: inherit;
        }
        .auth-btn:hover {
            background: #e5bd60;
            transform: translateY(-1px);
        }
        .auth-btn:active {
            transform: translateY(0);
        }
        .auth-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }
        .auth-signin-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--muted-white);
        }
        .auth-signin-link a {
            color: var(--rice-gold);
            text-decoration: none;
            font-weight: 700;
        }
        .auth-signin-link a:hover {
            color: #e5bd60;
            text-decoration: underline;
        }
        .auth-error {
            background: rgba(117, 36, 32, 0.74);
            border: 1px solid rgba(217, 104, 92, 0.5);
            color: #ffe4df;
            padding: 10px 14px;
            border-radius: 9px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
        }
        .auth-success {
            background: rgba(23, 61, 42, 0.80);
            border: 1px solid rgba(120, 168, 90, 0.5);
            color: #d0ddd3;
            padding: 10px 14px;
            border-radius: 9px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }
        .auth-loading {
            display: none;
            text-align: center;
            color: var(--muted-white);
            font-size: 13px;
            margin-bottom: 16px;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--rice-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 576px) {
            .auth-card { padding: 20px 16px; }
            .auth-panel { border-radius: 16px; }
            .auth-body { padding: 20px 24px 24px; }
        }
    </style>
</head>
<body class="auth-background">
    <div class="auth-card">
        <div class="auth-panel">
            <div class="auth-header">
                <div class="auth-brand">
                    <div class="auth-brand-mark">
                        <i class="bi bi-flower1"></i>
                    </div>
                    <div class="auth-brand-text">
                        <strong>RISE</strong>
                        <span>Rice Farmer Assistance &amp; Analytics</span>
                    </div>
                </div>
                <h1 class="auth-welcome">Reset Password</h1>
                <p class="auth-subtitle">Enter a new password for your account.</p>
            </div>
            <div class="auth-body">
                <div id="authError" class="auth-error" role="alert"></div>
                <div id="authSuccess" class="auth-success" role="status"></div>
                <div id="authLoading" class="auth-loading">
                    <span class="spinner"></span>Resetting password...
                </div>
                <form id="resetForm" novalidate>
                    <input type="hidden" id="resetToken" value="">
                    <div class="auth-field">
                        <label for="resetNewPassword">New Password <span class="text-danger">*</span></label>
                        <input type="password" id="resetNewPassword" name="newPassword" required minlength="8" maxlength="100" autocomplete="new-password" placeholder="••••••••">
                        <div class="auth-hint">At least 8 characters, with uppercase, lowercase, number, and special character.</div>
                    </div>
                    <div class="auth-field password-input">
                        <label for="resetConfirmPassword">Confirm New Password <span class="text-danger">*</span></label>
                        <input type="password" id="resetConfirmPassword" name="confirmNewPassword" required minlength="8" autocomplete="new-password" placeholder="••••••••">
                        <button type="button" class="toggle-password" id="toggleResetPassword" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <button type="submit" class="auth-btn" id="resetBtn">Reset Password</button>
                </form>
                <div class="auth-signin-link">
                    Remember your password? <a href="login.html">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="pages/css/js/auth.js"></script>
    <script>
        (function () {
            // Get token from URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get("token");
            document.getElementById("resetToken").value = token || "";

            const form = document.getElementById("resetForm");
            const errorEl = document.getElementById("authError");
            const successEl = document.getElementById("authSuccess");
            const loadingEl = document.getElementById("authLoading");
            const resetBtn = document.getElementById("resetBtn");

            if (!token) {
                errorEl.textContent = "No reset token provided. Please request a password reset from the login page.";
                errorEl.style.display = "block";
                resetBtn.disabled = true;
            }

            // Toggle password visibility
            document.getElementById("toggleResetPassword").addEventListener("click", function () {
                const input = document.getElementById("resetNewPassword");
                const isPassword = input.type === "password";
                input.type = isPassword ? "text" : "password";
                this.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
            });
            // Same for confirm - just mirror
            document.getElementById("toggleResetPassword").addEventListener("click", function () {
                const input = document.getElementById("resetConfirmPassword");
                const isPassword = input.type === "password";
                input.type = isPassword ? "text" : "password";
                this.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
            });

            function showError(message) {
                errorEl.textContent = message;
                errorEl.style.display = "block";
                successEl.style.display = "none";
            }

            function showSuccess(message) {
                successEl.textContent = message;
                successEl.style.display = "block";
                errorEl.style.display = "none";
            }

            function setLoading(loading) {
                if (loading) {
                    resetBtn.disabled = true;
                    resetBtn.textContent = "Resetting...";
                    loadingEl.style.display = "block";
                } else {
                    resetBtn.disabled = false;
                    resetBtn.textContent = "Reset Password";
                    loadingEl.style.display = "none";
                }
            }

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const token = document.getElementById("resetToken").value;
                if (!token) {
                    showError("No reset token provided.");
                    return;
                }
                setLoading(true);
                try {
                    await window.RISEAuth.resetPassword(
                        token,
                        document.getElementById("resetNewPassword").value,
                        document.getElementById("resetConfirmPassword").value
                    );
                    showSuccess("Password reset successfully! Redirecting to login...");
                    setLoading(false);
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);
                } catch (err) {
                    showError(err.message || "Password reset failed. Please try again.");
                    setLoading(false);
                }
            });
        })();
    </script>
</body>
</html>
